name: Release 🏗️

on:
  push:
    branches: [master]
  # Allow a manual kick-off (e.g. the first release, once Actions is enabled on
  # the repo), so opening the version-packages PR does not require a dummy push
  workflow_dispatch:
    inputs:
      crates_only:
        description: "Publish only the crates to crates.io (recovery when npm is already published for this version)"
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance + PyPI trusted publishing

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # pin Bun so the toolchain does not drift with floating latest
          bun-version: 1.3.6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Opens/updates the "version packages" PR (running `bun run version`,
      # which bumps @omnidotdev/odk and propagates the version to the crates and
      # the Python PDK). When that PR is merged, publishes the npm SDK via
      # `bun run release`
      - name: Create release PR or publish 🦋
        id: changesets
        uses: changesets/action@v2
        with:
          # odk needs an explicit version-script (not the default `changeset
          # version`) so the crate and Python versions sync from the npm bump
          version-script: bun run version
          publish-script: bun run release
          pr-title: "feature(release): version packages"
          commit-message: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance requires a public source repository; while the repo is
          # private it fails with E422. Gate it on NPM_PROVENANCE and set that
          # variable to `true` once the repo is public to turn attestation back on
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_PROVENANCE == 'true' }}

      # Everything below publishes the SAME version to the other registries, and
      # only runs on the push where a new version was actually published to npm
      - name: Set up Rust
        if: steps.changesets.outputs.published == 'true' || github.event.inputs.crates_only == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates to crates.io
        if: steps.changesets.outputs.published == 'true' || github.event.inputs.crates_only == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # odk-schema first: odk-cli and odk-pdk depend on it. The dependents
          # retry while the crates.io index catches up with the new odk-schema
          cargo publish -p odk-schema
          for crate in odk-cli odk-pdk; do
            published=false
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "$crate"; then published=true; break; fi
              echo "waiting for crates.io index (attempt $attempt)..."
              sleep 20
            done
            if [ "$published" = false ]; then
              echo "failed to publish $crate after retries" >&2
              exit 1
            fi
          done

      # The Python PDK publishes to PyPI via OIDC trusted publishing, which needs
      # a one-time trusted-publisher record created on pypi.org for this repo +
      # workflow. Until that exists the three steps below stay off, gated on the
      # `PUBLISH_PYPI` repository variable, so the first release ships npm + the
      # crates without blocking on PyPI. To enable: create the trusted publisher
      # on pypi.org (owner omnidotdev, repo odk, workflow release.yml), then set
      # the repo variable PUBLISH_PYPI to `true`
      - name: Set up Python
        if: steps.changesets.outputs.published == 'true' && vars.PUBLISH_PYPI == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python PDK
        if: steps.changesets.outputs.published == 'true' && vars.PUBLISH_PYPI == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build odk-pdk-py --outdir odk-pdk-py/dist

      - name: Publish Python PDK to PyPI
        if: steps.changesets.outputs.published == 'true' && vars.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: odk-pdk-py/dist

      # Manifold mirror (dogfood + funnel): publishes the same npm + Cargo
      # artifacts to the Omni-native registry under the `omni` namespace.
      # TODO(launch): confirm the Manifold npm + Cargo registry URLs and add the
      # MANIFOLD_TOKEN secret, then enable the commands below. Kept inert so a
      # public release never blocks on the mirror
      - name: Mirror to Manifold (npm + Cargo)
        if: steps.changesets.outputs.published == 'true'
        env:
          MANIFOLD_TOKEN: ${{ secrets.MANIFOLD_TOKEN }}
          MANIFOLD_NPM_REGISTRY: ${{ vars.MANIFOLD_NPM_REGISTRY }}
          MANIFOLD_CARGO_REGISTRY: ${{ vars.MANIFOLD_CARGO_REGISTRY }}
        run: |
          if [ -z "${MANIFOLD_NPM_REGISTRY:-}" ] || [ -z "${MANIFOLD_TOKEN:-}" ]; then
            echo "Manifold mirror not configured (MANIFOLD_NPM_REGISTRY / MANIFOLD_TOKEN unset); skipping"
            exit 0
          fi
          # npm mirror: same package name, different registry
          #   (cd odk-ts && npm publish --registry "$MANIFOLD_NPM_REGISTRY")
          # cargo mirror:
          #   cargo publish --registry manifold -p odk-schema ... (ordered)
          echo "Manifold mirror configured; wire the publish commands once the registry URLs are confirmed"
