[package]
name = "odk-pdk"
version = "0.1.3"
edition = "2024"
description = "ODK Plugin Development Kit for Rust - build WASM schema plugins"
license = "Apache-2.0"

[dependencies]
# Extism PDK for WASM plugins
extism-pdk = "1.0"

# Schema types (shared with host)
odk-schema = { path = "../odk-schema", version = "0.1.3" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
