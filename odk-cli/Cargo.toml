[package]
name = "odk-cli"
version = "0.0.0"
edition = "2024"
description = "ODK CLI - Unified schema compilation from TypeScript, WASM, or JSON to multiple targets"
license = "Apache-2.0"

[lib]
name = "odk_cli"
path = "src/lib.rs"

[[bin]]
name = "odk"
path = "src/main.rs"

[dependencies]
# Schema types
odk-schema = { path = "../odk-schema", version = "0.0.0" }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

# Extism for WASM plugin hosting
extism = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# Order-preserving map so schema declaration order (fields, variants) survives
# deserialization and generated output is deterministic
indexmap = { version = "2", features = ["serde"] }

# File handling
camino = { version = "1.1", features = ["serde1"] }
tempfile = "3.5"

# GraphQL parsing
apollo-parser = "0.8"

# HTTP client (for introspection and OCI publishing)
ureq = { version = "3", features = ["json"] }

# Content digests for OCI artifacts
sha2 = "0.10"

# Glob pattern matching (for --operations flag)
glob = "0.3"

# Process execution
which = "7"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy", "run-cargo-test"] }
