[package]
name = "blog-plugin-rust"
version = "0.1.0"
edition = "2021"
description = "Blog API schema as an ODK WASM plugin"
license = "Apache-2.0"
# example crate, never published to crates.io (the release workflow publishes
# only odk-schema, odk-cli, and odk-pdk)
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
odk-pdk = { path = "../../odk-pdk-rust" }
extism-pdk = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
