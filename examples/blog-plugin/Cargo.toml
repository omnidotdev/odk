[package]
name = "blog-plugin"
version = "0.1.0"
edition = "2024"
description = "Example ODK plugin - Blog API schema"
license = "Apache-2.0"
# example crate, never published to crates.io (the release workflow publishes
# only odk-schema, odk-cli, and odk-pdk)
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
odk-pdk = { path = "../../odk-pdk-rust" }
extism-pdk = "1.0"
